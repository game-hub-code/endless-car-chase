<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Endless Car Chase Game</title>
    <link rel="shortcut icon" href="TemplateData/img/favicon.ico">
    <link rel="stylesheet" href="TemplateData/css/style.css">
</head>
<body>
    <div class="keepRatio">
        <div id="gameContainer" class="unity-desktop webgl-content">
            <canvas id="gameCanvas" width="799" height="913" style="cursor: default;">
            </canvas>

            <div id="loadingBlock" style="display: none;">
                <img class="logo" src="TemplateData/img/Logo.png">
                <span class="subtitle">
                    <br>
                </span>
                <div id="progressBar">
                    <div>LOADING ...</div>
                    <div class="centered">
                        <div id="emptyBar" style="width: 0%;"></div>
                        <div id="fullBar" style="width: 100%;"></div>
                    </div>
                </div>
                <div id="warningBrowserBlock" style="display:none;">
                    <div class="warningBrowserText"></div>
                    <div class="browserIcons"></div>
                </div>
                <div id="warningMobileBlock" style="display:none;">
                    <div class="warningBrowserText">
                        " Please note that Unity WebGL is not currently supported on mobiles. "
                    </div>
                </div>
            </div>

            <div id="errorBrowserBlock" style="display:none;">
                <img class="logo" src="TemplateData/img/Logo.png">
                <span class="subtitle">
                    <br>
                </span>
                <div id="errorContent" style="display:none;">
                    <div class="errorBrowserText"></div>
                    <div class="browserIcons"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="Build/Endless_Car_Chase.loader.js"></script>
    <script src="Build/Endless_Car_Chase.framework.js"></script>
</body>
</html>
